[package]
name = "tree-sha256"
version = "0.1.0"
edition = "2024"
description = "SHA-256 content hash of a Git tree, and SSH-signed tags that carry it"
repository = "https://github.com/schacon/tree-sha256"

[dependencies]
anyhow = "1.0.104"
gix = { version = "0.88.0", default-features = false, features = ["max-performance-safe", "parallel", "sha1", "revision"] }
rayon = "1.12.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
